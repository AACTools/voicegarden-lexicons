name: CI

# Minimal gate: the fetcher crate must build, test, and lint.
# Bundle building, manifest validation, and release packaging run
# LOCALLY before pushing (make check-release) — see
# scripts/validate_release.py and examples/consumer_smoke.rs.
# Releases are cut manually with gh from the locally built dist/.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetcher crate tests
        run: cargo test --offline || cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
