name: Build & Release

# Runner discipline (see docs/data-sources.md "Process"):
# - push to main: cheap gate only (tests + lints)
# - pull_request: cheap gate + fast no-train bundle build + schema check
#   (heavy validation still happens locally first: make check-release)
# - tags: full ~3h release build with per-language WFST training —
#   cut ONLY when a release is actually ready
# Releases are infrequent and deliberate; day-to-day verification is
# local (make check-release).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetcher crate tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install floravox tools
        run: |
          cargo install -q --locked --version 0.8.5 floravox-g2p --bin floravox-fst-compile --bin floravox-train-phonetisaurus
      - name: Build all bundles (fast, no WFST training)
        run: python3 build.py --out dist --version "${GITHUB_SHA::7}" --no-train
      - name: Train one small language (trainer smoke)
        run: python3 build.py --langs sv --out dist-smoke --version smoke --train-iters 3
      - name: Validate manifest against schema
        run: |
          python3 -m pip install jsonschema
          python3 - <<'EOF'
          import json, jsonschema
          schema = json.load(open("schema.json"))
          manifest = json.load(open("dist/lexicons.json"))
          jsonschema.validate(manifest, schema)
          print("manifest OK:", len(manifest["languages"]), "languages")
          EOF

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install floravox tools
        run: |
          cargo install -q --locked --version 0.8.5 floravox-g2p --bin floravox-fst-compile --bin floravox-train-phonetisaurus
      # Pre-build the ARPABET converter (and its dep tree) before the
      # bundle build — compiling it mid-build OOMed on the runner once;
      # from this step on it is a cache hit.
      - name: Pre-build ARPABET converter
        run: cargo build --release --jobs 2 --example arpabet
      # Build WITH per-language WFST training (~3 h across all
      # languages, release tags only).
      # BASE TIER ONLY: the expanded tier (distill-v2 data, gitignored)
      # is built locally and its assets uploaded from the release
      # machine — the local `make check-release` gate covers both tiers
      # before any tag is pushed.
      - name: Build all bundles (with training)
        run: python3 build.py --out dist --version "${GITHUB_REF_NAME}"
      - name: Validate base manifest + gate what CI can see
        run: |
          python3 -m pip install jsonschema
          python3 - <<'EOF2'
          import json, jsonschema
          jsonschema.validate(json.load(open("dist/lexicons.json")), json.load(open("schema.json")))
          print("manifest OK")
          EOF2
          if ! python3 scripts/validate_release.py --skip-expanded --baseline \
            "https://github.com/AACTools/voicegarden-lexicons/releases/download/v0.5.1/lexicons.json"; then
            echo "::error::expand-only/validation failed — refusing to release"
            exit 1
          fi
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
